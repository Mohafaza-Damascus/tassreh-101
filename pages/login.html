<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#064239" />
  <meta name="description" content="تسجيل الدخول إلى لوحة تحكم متابعة التصاريح." />

  <link rel="icon" type="image/png" href="../assets/images/damascus-eagle.png" />

  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/style.css" />

  <title>تسجيل الدخول | لوحة التحكم</title>
</head>

<body class="login-shell">

  <div class="login-container">

    <header class="login-header">
      <img class="login-logo" src="../assets/images/logo.png" alt="شعار محافظة دمشق" />
      <h1>لوحة التحكم</h1>
    </header>

    <main class="login-card">

      <div class="login-card-head">
        <h2 class="login-card-title">تسجيل الدخول</h2>
      </div>

      <form class="login-form" id="login-form" novalidate>

        <div class="login-fields">
          <div class="login-field">
            <label class="login-label" for="login_username">اسم المستخدم</label>
            <input id="login_username" name="login_username" class="login-input" type="text"
                   autocomplete="username" placeholder="أدخل اسم المستخدم" required />
          </div>

          <div class="login-field">
            <label class="login-label" for="login_password">كلمة المرور</label>
            <input id="login_password" name="login_password" class="login-input" type="password"
                   autocomplete="current-password" placeholder="أدخل كلمة المرور" required />
          </div>
        </div>

        <p class="login-error" id="login-error" hidden role="alert">
          يرجى إدخال اسم المستخدم وكلمة المرور.
        </p>

        <div class="login-actions">
          <button type="submit" class="login-submit">
            تسجيل الدخول <span aria-hidden="true">←</span>
          </button>
          <a class="login-back" href="../index.html">العودة للرئيسية</a>
        </div>

      </form>

    </main>

  </div>

  <script src="../js/login.js"></script>
</body>

</html>
